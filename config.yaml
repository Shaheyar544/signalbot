symbols:
  ETHUSDT:
    enabled: true
  BTCUSDT:
    enabled: true
  SOLUSDT:
    enabled: true
  BNBUSDT:
    enabled: true

  XRPUSDT:
    enabled: true

timeframes:
  primary: 15m
  confirmation: [1h, 4h]

market:
  exchange: binance
  market_type: usd_m_futures

data:
  historical_candle_limit: 500
  database_path: data/signal_engine.db

historical:
  symbols: [ETHUSDT, BTCUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
  years: 3
  timeframes: [15m, 1h, 4h]

websocket:
  reconnect_enabled: true
  max_reconnect_delay_seconds: 60
  receive_timeout_seconds: 90

swing:
  left_bars: 3
  right_bars: 3

csd:
  minimum_close_distance_percent: 0.05

# V1-compatible default. Set method: atr only for an explicitly configured
# research variant; the ATR is calculated from closed candles only.
breakout:
  method: percent
  minimum_close_distance_percent: 0.05
  minimum_close_atr: 0.15

# Observational context only. variants.regime_filter remains none, so these
# classifications do not alter frozen V1 signal behaviour.
regime:
  high_atr_percent: 1.5
  low_atr_percent: 0.3
  trend_ema_separation_percent: 0.2
  range_ema_separation_percent: 0.05

retest:
  zone_percent: 0.20
  maximum_bars_after_breakout: 12

confirmation:
  rsi_bullish_minimum: 50
  rsi_bearish_maximum: 50
  volume_ratio_minimum: 1

risk:
  stop_buffer_percent: 0

cost:
  taker_fee_percent: 0.05
  maker_fee_percent: 0.02
  entry_order_type: taker
  exit_order_type: taker
  slippage_percent: 0.02
  slippage_percent_stop: 0.05
  funding_rate_fixed_percent: 0.01
  funding_rate_source: fixed

exit_policy:
  name: scaled
  legs:
    - target_r: 1.0
      size_percent: 50
    - target_r: 2.0
      size_percent: 25
    - target_r: 3.0
      size_percent: 25
  move_stop_to_breakeven_after_leg: 1
  breakeven_offset_r: 0.1
  time_stop_bars: 48
  intrabar_fill_assumption: pessimistic

variants:
  entry_mode: retest
  require_htf_agreement: false
  regime_filter: none
  regime_min_atr_percentile: 40
  session_filter: none

go_live_gate:
  min_out_of_sample_trades: 100
  min_net_expectancy_r: 0.10
  max_in_sample_out_sample_ratio: 2.0
  min_baseline_percentile: 95
  max_drawdown_r: 20
  require_positive_in_symbols: 3
  report_max_age_days: 30
