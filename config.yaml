symbols:
  ETHUSDT:
    enabled: true
  BTCUSDT:
    enabled: false
  SOLUSDT:
    enabled: false
  BNBUSDT:
    enabled: false

  XRPUSDT:
    enabled: false

timeframes:
  primary: 15m
  confirmation: [1h, 4h]

market:
  exchange: binance
  market_type: usd_m_futures

data:
  historical_candle_limit: 500
  database_path: data/signal_engine.db

historical:
  symbols: [ETHUSDT, BTCUSDT, SOLUSDT, BNBUSDT, XRPUSDT]
  years: 3
  timeframes: [15m, 1h, 4h]

websocket:
  reconnect_enabled: true
  max_reconnect_delay_seconds: 60
  receive_timeout_seconds: 90

swing:
  left_bars: 3
  right_bars: 3

csd:
  minimum_close_distance_percent: 0.05

retest:
  zone_percent: 0.20
  maximum_bars_after_breakout: 12

confirmation:
  rsi_bullish_minimum: 50
  rsi_bearish_maximum: 50
  volume_ratio_minimum: 1

risk:
  stop_buffer_percent: 0

cost:
  taker_fee_percent: 0.05
  maker_fee_percent: 0.02
  entry_order_type: taker
  exit_order_type: taker
  slippage_percent: 0.02
  slippage_percent_stop: 0.05
  funding_rate_fixed_percent: 0.01

exit_policy:
  name: scaled
  legs:
    - target_r: 1.0
      size_percent: 50
    - target_r: 2.0
      size_percent: 25
    - target_r: 3.0
      size_percent: 25
  move_stop_to_breakeven_after_leg: 1
  breakeven_offset_r: 0.1
  time_stop_bars: 48
